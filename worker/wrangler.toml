name = "soundseek-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Nur diese Seite darf das Backend aufrufen. Trag hier deine GitHub-Pages-URL
# ein (ohne Slash am Ende), sobald sie steht — z. B.
#   ALLOWED_ORIGINS = "https://deinname.github.io"
# Mehrere durch Komma trennen. "*" erlaubt jeden.
[vars]
ALLOWED_ORIGINS = "https://zeon-kk.github.io"
AUDD_MARKET = "de"

# AUDD_API_TOKEN wird NICHT hier eingetragen, sondern als Secret:
#   npx wrangler secret put AUDD_API_TOKEN
